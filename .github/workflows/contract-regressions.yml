name: Contract regressions
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: contract-regressions-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      contract: ${{ steps.paths.outputs.contract }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect contract changes
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
          if not all(re.fullmatch(r'(?:[0-9a-f]{40}|[0-9a-f]{64})', sha)
                     for sha in (base, head)):
              raise SystemExit('expected exact base and head commit IDs')
          # Inspect the complete endpoint diff, without the API/path-filter file cap.
          # Disabling renames retains deletions when contract files move into submission/.
          paths = subprocess.check_output([
              'git', 'diff', '--no-ext-diff', '--no-textconv', '--no-renames',
              '--name-only', '-z', base, head, '--']).split(b'\0')
          contract = any(path and not path.startswith(b'submission/') for path in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'contract={str(contract).lower()}\n')
          print(f'Contract regressions required: {contract}')
          PY
  regressions:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    uses: ./.github/workflows/benchmark.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      contract_regressions: true
  contract-regressions:
    # Keep a completed gate on every PR; a failed detector must not look like a passing skip.
    if: always()
    needs: [changes, regressions]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check contract regression result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CONTRACT_CHANGED: ${{ needs.changes.outputs.contract }}
          REGRESSIONS_RESULT: ${{ needs.regressions.result }}
        run: |
          if [[ "$CHANGES_RESULT" != success ]]; then
            echo 'Contract change detection did not succeed.' >&2
            exit 1
          fi
          case "$CONTRACT_CHANGED:$REGRESSIONS_RESULT" in
            true:success) echo 'Contract regressions passed.' ;;
            false:skipped) echo 'Contract files are unchanged.' ;;
            *) echo 'Contract change detection or regression execution did not succeed.' >&2; exit 1 ;;
          esac
