name: Benchmark Pareto
on:
  workflow_dispatch:
    inputs:
      yukon_evaluation:
        description: Yukon evaluation scope (the verifier always checks the full certificate)
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      ref:
        description: Exact candidate commit to check
        required: true
        type: string
permissions:
  contents: read
jobs:
  benchmark:
    uses: ./.github/workflows/benchmark.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
      track: pareto
