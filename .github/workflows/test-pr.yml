name: Test PR
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: test-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  benchmark:
    # Yukon dispatches benchmark.yml itself for solver submissions.
    if: ${{ !startsWith(github.head_ref, 'submissions/') }}
    uses: ./.github/workflows/benchmark.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
