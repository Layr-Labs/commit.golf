name: Benchmark
on:
  workflow_dispatch:
    inputs:
      contract_regressions:
        description: Also run artifact linkage and maximum-image workflows in parallel
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      track:
        description: Track to verify
        required: false
        default: product
        type: string
      ref:
        description: Exact candidate commit to check
        required: true
        type: string
      contract_regressions:
        description: Also run artifact linkage and maximum-image workflows in parallel
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  benchmark:
    # 64 GB host: 32 GB for the isolated verifier VM, with host headroom.
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-verifier
      - name: Benchmark
        env:
          TRACK: ${{ inputs.track || 'product' }}
        run: |
          case "$TRACK" in
            product) bash scripts/blacksmith.sh run ;;
            pareto) bash scripts/blacksmith.sh run-pareto ;;
            commit-golf-64-32-product) bash scripts/blacksmith.sh run-commit-golf-64-32-product ;;
            commit-golf-64-32-pareto) bash scripts/blacksmith.sh run-commit-golf-64-32-pareto ;;
            commit-golf-96-32-product) bash scripts/blacksmith.sh run-commit-golf-96-32-product ;;
            commit-golf-96-32-pareto) bash scripts/blacksmith.sh run-commit-golf-96-32-pareto ;;
            commit-golf-oracle-rounds-pareto) bash scripts/blacksmith.sh run-commit-golf-oracle-rounds-pareto ;;
            commit-golf-work-span-pareto) bash scripts/blacksmith.sh run-commit-golf-work-span-pareto ;;
            *) echo 'Unknown track' >&2; exit 1 ;;
          esac
      - name: Collect results
        if: always()
        run: bash scripts/blacksmith.sh collect
      - name: Prepare score artifact
        env:
          TRACK: ${{ inputs.track || 'product' }}
        run: |
          case "$TRACK" in
            product) score_path=scripts/score.json ;;
            pareto) score_path=scripts/pareto/score.json ;;
            commit-golf-64-32-product) score_path=scripts/commit-golf-64-32-product/score.json ;;
            commit-golf-64-32-pareto) score_path=scripts/commit-golf-64-32-pareto/score.json ;;
            commit-golf-96-32-product) score_path=scripts/commit-golf-96-32-product/score.json ;;
            commit-golf-96-32-pareto) score_path=scripts/commit-golf-96-32-pareto/score.json ;;
            commit-golf-oracle-rounds-pareto) score_path=scripts/commit-golf-oracle-rounds-pareto/score.json ;;
            commit-golf-work-span-pareto) score_path=scripts/commit-golf-work-span-pareto/score.json ;;
            *) exit 1 ;;
          esac
          mkdir -p ".work/score-artifact/$(dirname "$score_path")"
          cp "$score_path" ".work/score-artifact/$score_path"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-score-${{ inputs.track || 'product' }}
          path: .work/score-artifact/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload verifier logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verifier-logs-${{ inputs.track || 'product' }}
          path: |
            .work/*/verify.log
            .work-vm-console.log
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Stop verifier VM
        if: always()
        run: bash scripts/blacksmith.sh stop
  linkage:
    if: inputs.contract_regressions
    uses: ./.github/workflows/test-linkage.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
  scale:
    if: inputs.contract_regressions
    uses: ./.github/workflows/test-scale.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
