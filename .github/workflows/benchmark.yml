name: Benchmark
on:
  workflow_dispatch:
    inputs:
      contract_regressions:
        description: Run the maintainer artifact linkage and maximum-image regressions
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      ref:
        description: Exact candidate commit to check
        required: true
        type: string
      contract_regressions:
        description: Run the maintainer artifact linkage and maximum-image regressions
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  benchmark:
    # 64 GB host: 32 GB for the isolated verifier VM, with host headroom.
    runs-on: blacksmith-16vcpu-ubuntu-2404
    # Total job quota; the verifier retains its separate four-hour/24-GiB limits.
    # Bootstrap/network delays can still exhaust this quota before proofs finish.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Offline VM bootstrap regressions
        run: python3 -m unittest discover -s verifier/tests -p test_vm_bootstrap.py
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache
        with:
          path: .cache/trusted.tar.zst
          key: verifier-ubuntu26-vm-${{ runner.arch }}-${{ hashFiles('CommitGolf/**', 'CommitGolf.lean', 'CommitGolfBaseline/**', 'CommitGolfBaseline.lean', 'lakefile.lean', 'lake-manifest.json', 'lean-toolchain', 'verifier/**', 'scripts/setup.sh', 'scripts/blacksmith.sh', 'scripts/vm-setup.sh', 'scripts/vm-packages.sh') }}-v2
      - name: Identify pinned VM image
        id: image
        run: echo "sha256=$(bash scripts/blacksmith.sh image-key)" >> "$GITHUB_OUTPUT"
      - name: Restore VM image
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: image-cache
        with:
          path: .cache/vm-image/${{ steps.image.outputs.sha256 }}.img
          key: verifier-base-image-${{ steps.image.outputs.sha256 }}-v1
      - name: Prepare and verify VM image
        timeout-minutes: 25
        run: bash scripts/blacksmith.sh prepare-image
      # Save only the verified base image, before VM setup or candidate execution.
      # The default branch seeds the cache shared with submission branches.
      - name: Save VM image
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.image-cache.outputs.cache-hit != 'true' && github.ref_name == github.event.repository.default_branch
        with:
          path: .cache/vm-image/${{ steps.image.outputs.sha256 }}.img
          key: ${{ steps.image-cache.outputs.cache-primary-key }}
      - name: Start verifier VM
        timeout-minutes: 50
        run: bash scripts/blacksmith.sh start
      - name: Setup
        run: bash scripts/blacksmith.sh setup
      # Save trusted builds before candidate verification, even if the proof fails.
      # Only the default branch publishes caches shared with submission branches.
      - name: Export trusted cache
        if: steps.cache.outputs.cache-hit != 'true' && github.ref_name == github.event.repository.default_branch
        run: bash scripts/blacksmith.sh cache
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.cache.outputs.cache-hit != 'true' && github.ref_name == github.event.repository.default_branch
        with:
          path: .cache/trusted.tar.zst
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Benchmark
        run: bash scripts/blacksmith.sh run
      - name: Verifier regressions and artifact linkage
        if: inputs.contract_regressions
        run: bash scripts/blacksmith.sh test-linkage
      - name: Maximum artifact admission and byte linkage
        if: inputs.contract_regressions
        run: bash scripts/blacksmith.sh test-scale
      - name: Collect results
        if: always()
        run: bash scripts/blacksmith.sh collect
      - name: Prepare score artifact
        run: |
          mkdir -p .work/score-artifact/scripts
          cp scripts/score.json .work/score-artifact/scripts/score.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-score
          path: .work/score-artifact/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload verifier logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verifier-logs
          path: |
            .work/*/verify.log
            .work-vm-console.log
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Stop verifier VM
        if: always()
        run: bash scripts/blacksmith.sh stop
